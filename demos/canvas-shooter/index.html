<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Canvas Shooter</title>
<style>
  body { margin:0; background:black; overflow:hidden; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
resize();
window.addEventListener("resize", resize);

function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}

let player = { x: canvas.width/2, y: canvas.height-60 };
let bullets = [];
let enemies = [];
let shake = 0;
let score = 0;

document.addEventListener("keydown", e=>{
  if(e.key===" ") shoot();
  if(e.key==="r") location.reload();
});

function shoot(){
  bullets.push({x:player.x, y:player.y, v:-10});
}

function spawnEnemy(){
  enemies.push({
    x: Math.random()*canvas.width,
    y: -20,
    v: 2 + Math.random()*2,
    r: 15
  });
}

setInterval(spawnEnemy, 500);

function update(){
  bullets.forEach(b=>b.y+=b.v);
  enemies.forEach(e=>e.y+=e.v);

  bullets = bullets.filter(b=>b.y>-20);
  enemies = enemies.filter(e=>e.y<canvas.height+20);

  enemies.forEach((e,ei)=>{
    bullets.forEach((b,bi)=>{
      let dx=e.x-b.x, dy=e.y-b.y;
      if(dx*dx+dy*dy < e.r*e.r){
        enemies.splice(ei,1);
        bullets.splice(bi,1);
        shake = 10;
        score++;
      }
    });
  });
}

function draw(){
  ctx.save();
  if(shake){
    ctx.translate(
      (Math.random()-0.5)*shake,
      (Math.random()-0.5)*shake
    );
    shake--;
  }

  ctx.fillStyle="rgba(0,0,0,0.3)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // player
  ctx.fillStyle="cyan";
  ctx.fillRect(player.x-15, player.y-15, 30, 30);

  // bullets
  ctx.fillStyle="yellow";
  bullets.forEach(b=>{
    ctx.beginPath();
    ctx.arc(b.x,b.y,4,0,Math.PI*2);
    ctx.fill();
  });

  // enemies
  enemies.forEach(e=>{
    ctx.fillStyle="red";
    ctx.beginPath();
    ctx.arc(e.x,e.y,e.r,0,Math.PI*2);
    ctx.fill();
  });

  ctx.restore();

  ctx.fillStyle="white";
  ctx.fillText("SCORE: "+score,20,30);
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();

document.addEventListener("mousemove", e=>{
  player.x = e.clientX;
});
</script>
</body>
</html>
