<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Canvas Shooter - Rich</title>
<style>
  body {
    margin: 0;
    background: black;
    overflow: hidden;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

resize();
window.addEventListener("resize", resize);

function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}

// =====================
// GAME STATE
// =====================
let player = { x: canvas.width/2, y: canvas.height-70 };
let bullets = [];
let enemies = [];
let shake = 0;
let score = 0;

// =====================
// INPUT
// =====================
document.addEventListener("mousemove", e=>{
  player.x = e.clientX;
});

document.addEventListener("keydown", e=>{
  if(e.key === " ") shoot();
  if(e.key === "r") location.reload();
});

// =====================
// GAME LOGIC
// =====================
function shoot(){
  bullets.push({
    x: player.x,
    y: player.y,
    v: -14
  });
}

function spawnEnemy(){
  enemies.push({
    x: Math.random() * canvas.width,
    y: -30,
    v: 2 + Math.random() * 2,
    r: 16
  });
}
setInterval(spawnEnemy, 450);

function update(){
  bullets.forEach(b => b.y += b.v);
  enemies.forEach(e => e.y += e.v);

  bullets = bullets.filter(b => b.y > -50);
  enemies = enemies.filter(e => e.y < canvas.height + 50);

  enemies.forEach((e, ei)=>{
    bullets.forEach((b, bi)=>{
      const dx = e.x - b.x;
      const dy = e.y - b.y;
      if(dx*dx + dy*dy < e.r*e.r){
        enemies.splice(ei,1);
        bullets.splice(bi,1);
        shake = 12;
        score++;
      }
    });
  });
}

// =====================
// DRAW UTILITIES
// =====================
function clearWithTrail(){
  ctx.fillStyle = "rgba(0,0,0,0.25)";
  ctx.fillRect(0,0,canvas.width,canvas.height);
}

function drawPlayer(p){
  const size = 18;
  const g = ctx.createLinearGradient(
    p.x-size, p.y-size,
    p.x+size, p.y+size
  );
  g.addColorStop(0, "#00ffff");
  g.addColorStop(1, "#0066ff");

  ctx.save();
  ctx.shadowBlur = 25;
  ctx.shadowColor = "#00ffff";
  ctx.fillStyle = g;
  ctx.fillRect(p.x-size, p.y-size, size*2, size*2);
  ctx.restore();
}

function drawBullet(b){
  const r = 4;
  const g = ctx.createRadialGradient(
    b.x, b.y, 0,
    b.x, b.y, r*4
  );
  g.addColorStop(0, "rgba(255,255,180,1)");
  g.addColorStop(0.4, "rgba(255,200,80,0.8)");
  g.addColorStop(1, "rgba(255,80,0,0)");

  ctx.save();
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(b.x, b.y, r*4, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawEnemy(e){
  const g = ctx.createRadialGradient(
    e.x, e.y, 0,
    e.x, e.y, e.r*2.5
  );
  g.addColorStop(0, "rgba(255,120,120,1)");
  g.addColorStop(0.6, "rgba(200,0,0,0.9)");
  g.addColorStop(1, "rgba(80,0,0,0)");

  ctx.save();
  ctx.shadowBlur = 30;
  ctx.shadowColor = "red";
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(e.x, e.y, e.r*2.5, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

// =====================
// DRAW
// =====================
function draw(){
  ctx.save();

  if(shake){
    ctx.translate(
      (Math.random()-0.5)*shake,
      (Math.random()-0.5)*shake
    );
    shake--;
  }

  clearWithTrail();

  // 覚醒演出（スコア連動）
  if(score > 30){
    ctx.globalCompositeOperation = "lighter";
  } else {
    ctx.globalCompositeOperation = "source-over";
  }

  drawPlayer(player);
  bullets.forEach(drawBullet);
  enemies.forEach(drawEnemy);

  ctx.restore();

  // UI
  ctx.fillStyle = "white";
  ctx.font = "16px monospace";
  ctx.fillText("SCORE: " + score, 20, 30);
}

// =====================
// LOOP
// =====================
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
