<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Canvas Shooter - Rich BGM</title>
<style>
  body { margin:0; background:black; overflow:hidden; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

resize();
window.addEventListener("resize", resize);
function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}

// =====================
// AUDIO
// =====================
let audioCtx;
let masterGain, bgmGain, filter;
let bgmTimer = null;
let bgmStarted = false;
let step = 0;

const seq = [110, 0, 165, 0, 220, 0, 165, 0];

function initAudio(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.6;
    masterGain.connect(audioCtx.destination);

    bgmGain = audioCtx.createGain();
    bgmGain.gain.value = 0.05;

    filter = audioCtx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = 600;

    bgmGain.connect(filter).connect(masterGain);
  }
  if(!bgmStarted){
    startBGM();
    bgmStarted = true;
  }
}

function playShoot(){
  if(!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();

  o.type = "square";
  o.frequency.setValueAtTime(900, audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.08);

  g.gain.setValueAtTime(0.12, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);

  o.connect(g).connect(masterGain);
  o.start();
  o.stop(audioCtx.currentTime + 0.1);
}

function playHit(){
  if(!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();

  o.type = "sawtooth";
  o.frequency.value = 140;

  g.gain.setValueAtTime(0.25, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);

  o.connect(g).connect(masterGain);
  o.start();
  o.stop(audioCtx.currentTime + 0.25);
}

// ---- BGM ----
function startBGM(){
  bgmTimer = setInterval(()=>{
    if(!audioCtx) return;

    const freq = seq[step];
    if(freq){
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();

      o.type = "triangle";
      o.frequency.value = freq;

      g.gain.value = 0.08;

      o.connect(g).connect(bgmGain);
      o.start();
      o.stop(audioCtx.currentTime + 0.18);
    }
    step = (step + 1) % seq.length;
  }, 180);
}

function updateBGM(){
  if(!bgmGain || !filter) return;
  if(score > 30){
    bgmGain.gain.value = 0.09;
    filter.frequency.value = 1200;
  } else {
    bgmGain.gain.value = 0.05;
    filter.frequency.value = 600;
  }
}

// =====================
// GAME STATE
// =====================
let player = { x: canvas.width/2, y: canvas.height-70 };
let bullets = [];
let enemies = [];
let shake = 0;
let score = 0;

// =====================
// INPUT
// =====================
document.addEventListener("mousemove", e=>{
  initAudio();
  player.x = e.clientX;
});

document.addEventListener("keydown", e=>{
  initAudio();
  if(e.key === " ") shoot();
  if(e.key === "r") location.reload();
});

// =====================
// GAME LOGIC
// =====================
function shoot(){
  playShoot();
  bullets.push({ x: player.x, y: player.y, v: -14 });
}

function spawnEnemy(){
  enemies.push({
    x: Math.random() * canvas.width,
    y: -30,
    v: 2 + Math.random() * 2,
    r: 16
  });
}
setInterval(spawnEnemy, 450);

function update(){
  bullets.forEach(b => b.y += b.v);
  enemies.forEach(e => e.y += e.v);

  bullets = bullets.filter(b => b.y > -50);
  enemies = enemies.filter(e => e.y < canvas.height + 50);

  enemies.forEach((e, ei)=>{
    bullets.forEach((b, bi)=>{
      const dx = e.x - b.x;
      const dy = e.y - b.y;
      if(dx*dx + dy*dy < e.r*e.r){
        enemies.splice(ei,1);
        bullets.splice(bi,1);
        shake = 12;
        score++;
        playHit();
      }
    });
  });
}

// =====================
// DRAW
// =====================
function clearWithTrail(){
  ctx.fillStyle = "rgba(0,0,0,0.25)";
  ctx.fillRect(0,0,canvas.width,canvas.height);
}

function drawPlayer(p){
  const s = 18;
  ctx.save();
  ctx.shadowBlur = 25;
  ctx.shadowColor = "#00ffff";
  ctx.fillStyle = "#00ccff";
  ctx.fillRect(p.x-s, p.y-s, s*2, s*2);
  ctx.restore();
}

function draw(){
  ctx.save();
  if(shake){
    ctx.translate(
      (Math.random()-0.5)*shake,
      (Math.random()-0.5)*shake
    );
    shake--;
  }

  clearWithTrail();

  if(score > 30){
    ctx.globalCompositeOperation = "lighter";
  }

  drawPlayer(player);

  bullets.forEach(b=>{
    ctx.fillStyle = "orange";
    ctx.beginPath();
    ctx.arc(b.x,b.y,6,0,Math.PI*2);
    ctx.fill();
  });

  enemies.forEach(e=>{
    ctx.fillStyle = "red";
    ctx.beginPath();
    ctx.arc(e.x,e.y,e.r*2,0,Math.PI*2);
    ctx.fill();
  });

  ctx.restore();

  ctx.fillStyle = "white";
  ctx.font = "16px monospace";
  ctx.fillText("SCORE: " + score, 20, 30);
}

// =====================
// LOOP
// =====================
function loop(){
  update();
  updateBGM();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
