<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SVG Shooter (JS × SVG)</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans JP", sans-serif; margin: 16px; }
    .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
    .panel { min-width: 320px; }
    .hint { color: #555; font-size: 14px; line-height: 1.5; }
    button { padding: 8px 12px; }
    kbd { padding: 2px 6px; border: 1px solid #ccc; border-bottom-width: 2px; border-radius: 6px; background: #fafafa; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
</head>
<body>
  <div class="row">
    <div class="panel">
      <h2>SVG Shooter（完成版）</h2>
      <div class="hint">
        操作：<kbd>←</kbd><kbd>→</kbd> or <kbd>A</kbd><kbd>D</kbd> 移動 / <kbd>Space</kbd> 連射 / <kbd>R</kbd> リスタート<br/>
        ※スマホは画面下のボタンでも操作できます。
      </div>
      <p class="hint mono" id="status"></p>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button id="btnLeft">◀</button>
        <button id="btnRight">▶</button>
        <button id="btnFire">FIRE</button>
        <button id="btnRestart">RESTART</button>
      </div>
    </div>

    <div class="panel">
      <svg id="game" width="480" height="320" viewBox="0 0 480 320"
           style="border:1px solid #ccc; border-radius: 10px; background: #fff;">
        <!-- HUD -->
        <text id="hud" x="12" y="22" font-size="14" fill="#111">SCORE 0 / LIFE 3</text>

        <!-- Player -->
        <g id="player" transform="translate(240, 285)">
          <rect x="-16" y="-10" width="32" height="20" rx="4" fill="#2563eb"></rect>
          <rect x="-3" y="-18" width="6" height="10" rx="2" fill="#1e3a8a"></rect>
        </g>

        <!-- Groups -->
        <g id="bullets"></g>
        <g id="enemies"></g>
        <g id="fx"></g>

        <!-- Overlay -->
        <g id="overlay" visibility="hidden">
          <rect x="0" y="0" width="480" height="320" fill="rgba(0,0,0,0.5)"></rect>
          <text id="overlayText" x="240" y="150" text-anchor="middle" font-size="22" fill="#fff">
            GAME OVER
          </text>
          <text x="240" y="180" text-anchor="middle" font-size="14" fill="#fff">
            Press R / RESTART
          </text>
        </g>
      </svg>
    </div>
  </div>

<script>
(() => {
  "use strict";

  // ---------- SVG helpers ----------
  const NS = "http://www.w3.org/2000/svg";
  const el = (name, attrs = {}) => {
    const node = document.createElementNS(NS, name);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, String(v));
    return node;
  };

  // ---------- Game constants ----------
  const W = 480, H = 320;
  const PLAYER_Y = 285;
  const PLAYER_HALF_W = 16;
  const BULLET_R = 3;
  const ENEMY_W = 28;
  const ENEMY_H = 18;

  // Tuning (feel free to tweak)
  const PLAYER_SPEED = 260;     // px/s
  const BULLET_SPEED = 520;     // px/s
  const ENEMY_SPEED_MIN = 50;   // px/s
  const ENEMY_SPEED_MAX = 120;  // px/s
  const SPAWN_PER_SEC = 1.7;    // enemies per second (average)
  const FIRE_COOLDOWN = 0.12;   // seconds between shots

  // ---------- DOM ----------
  const svg = document.querySelector("#game");
  const gPlayer = document.querySelector("#player");
  const gBullets = document.querySelector("#bullets");
  const gEnemies = document.querySelector("#enemies");
  const gFx = document.querySelector("#fx");
  const hud = document.querySelector("#hud");
  const overlay = document.querySelector("#overlay");
  const overlayText = document.querySelector("#overlayText");
  const status = document.querySelector("#status");

  const btnLeft = document.querySelector("#btnLeft");
  const btnRight = document.querySelector("#btnRight");
  const btnFire = document.querySelector("#btnFire");
  const btnRestart = document.querySelector("#btnRestart");

  // ---------- State ----------
  let running = true;

  const state = {
    t: 0,
    score: 0,
    life: 3,

    playerX: W / 2,

    bullets: [], // {x, y, vy, node}
    enemies: [], // {x, y, vy, node}

    keys: { left: false, right: false, fire: false },
    fireTimer: 0,

    spawnAccumulator: 0
  };

  // ---------- Input ----------
  const setKey = (k, v) => { state.keys[k] = v; };

  window.addEventListener("keydown", (e) => {
    if (e.repeat) return;
    if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") setKey("left", true);
    if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") setKey("right", true);
    if (e.key === " " || e.code === "Space") setKey("fire", true);
    if (e.key.toLowerCase() === "r") restart();
  });

  window.addEventListener("keyup", (e) => {
    if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") setKey("left", false);
    if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") setKey("right", false);
    if (e.key === " " || e.code === "Space") setKey("fire", false);
  });

  // Touch/Buttons (press-and-hold for move/fire)
  const hold = (btn, onDown, onUp) => {
    btn.addEventListener("pointerdown", (e) => { e.preventDefault(); btn.setPointerCapture(e.pointerId); onDown(); });
    btn.addEventListener("pointerup", (e) => { e.preventDefault(); onUp(); });
    btn.addEventListener("pointercancel", (e) => { e.preventDefault(); onUp(); });
    btn.addEventListener("pointerleave", () => { onUp(); });
  };
  hold(btnLeft,  () => setKey("left", true),  () => setKey("left", false));
  hold(btnRight, () => setKey("right", true), () => setKey("right", false));
  hold(btnFire,  () => setKey("fire", true),  () => setKey("fire", false));
  btnRestart.addEventListener("click", restart);

  // ---------- Game object creation ----------
  function spawnBullet(x, y) {
    const node = el("circle", { cx: x, cy: y, r: BULLET_R, fill: "#ef4444" });
    gBullets.appendChild(node);
    state.bullets.push({ x, y, vy: -BULLET_SPEED, node });
  }

  function spawnEnemy() {
    const x = rand(ENEMY_W/2 + 6, W - ENEMY_W/2 - 6);
    const y = -ENEMY_H;
    const vy = rand(ENEMY_SPEED_MIN, ENEMY_SPEED_MAX);

    // Enemy as <g> for easy future upgrades
    const node = el("g", { transform: `translate(${x},${y})` });
    node.appendChild(el("rect", {
      x: -ENEMY_W/2, y: -ENEMY_H/2, width: ENEMY_W, height: ENEMY_H,
      rx: 4, fill: "#111827"
    }));
    node.appendChild(el("rect", {
      x: -ENEMY_W/2 + 4, y: -ENEMY_H/2 + 4, width: ENEMY_W - 8, height: 4,
      rx: 2, fill: "#9ca3af"
    }));
    gEnemies.appendChild(node);

    state.enemies.push({ x, y, vy, node });
  }

  function boom(x, y) {
    // Simple ring effect
    const ring = el("circle", { cx: x, cy: y, r: 4, fill: "none", stroke: "#f97316", "stroke-width": 2, opacity: 1 });
    gFx.appendChild(ring);

    const start = performance.now();
    const duration = 220;
    const tick = (now) => {
      const p = Math.min(1, (now - start) / duration);
      ring.setAttribute("r", String(4 + p * 14));
      ring.setAttribute("opacity", String(1 - p));
      if (p < 1) requestAnimationFrame(tick);
      else ring.remove();
    };
    requestAnimationFrame(tick);
  }

  // ---------- Collision ----------
  function hitBulletEnemy(b, e) {
    // Bullet is circle, enemy is AABB (rect)
    const ex0 = e.x - ENEMY_W/2;
    const ex1 = e.x + ENEMY_W/2;
    const ey0 = e.y - ENEMY_H/2;
    const ey1 = e.y + ENEMY_H/2;

    const bx = b.x;
    const by = b.y;

    return (bx >= ex0 && bx <= ex1 && by >= ey0 && by <= ey1);
  }

  function hitEnemyPlayer(e) {
    // Player as AABB
    const px0 = state.playerX - PLAYER_HALF_W;
    const px1 = state.playerX + PLAYER_HALF_W;
    const py0 = PLAYER_Y - 10;
    const py1 = PLAYER_Y + 10;

    const ex0 = e.x - ENEMY_W/2;
    const ex1 = e.x + ENEMY_W/2;
    const ey0 = e.y - ENEMY_H/2;
    const ey1 = e.y + ENEMY_H/2;

    return !(ex1 < px0 || ex0 > px1 || ey1 < py0 || ey0 > py1);
  }

  // ---------- Loop ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;

    if (running) {
      update(dt);
      render();
      requestAnimationFrame(loop);
    }
  }

  function update(dt) {
    state.t += dt;

    // Player movement
    let vx = 0;
    if (state.keys.left) vx -= PLAYER_SPEED;
    if (state.keys.right) vx += PLAYER_SPEED;

    state.playerX = clamp(state.playerX + vx * dt, PLAYER_HALF_W, W - PLAYER_HALF_W);

    // Fire
    state.fireTimer -= dt;
    if (state.keys.fire && state.fireTimer <= 0) {
      spawnBullet(state.playerX, PLAYER_Y - 18);
      state.fireTimer = FIRE_COOLDOWN;
    }

    // Spawn enemies (Poisson-like using accumulator)
    state.spawnAccumulator += dt * SPAWN_PER_SEC;
    while (state.spawnAccumulator >= 1) {
      spawnEnemy();
      state.spawnAccumulator -= 1;
    }

    // Move bullets
    for (const b of state.bullets) {
      b.y += b.vy * dt;
    }

    // Move enemies
    for (const e of state.enemies) {
      e.y += e.vy * dt;
    }

    // Bullet-enemy collisions
    const deadBullets = new Set();
    const deadEnemies = new Set();

    for (let i = 0; i < state.bullets.length; i++) {
      const b = state.bullets[i];
      if (b.y < -10) {
        deadBullets.add(i);
        continue;
      }
      for (let j = 0; j < state.enemies.length; j++) {
        if (deadEnemies.has(j)) continue;
        const e = state.enemies[j];
        if (hitBulletEnemy(b, e)) {
          deadBullets.add(i);
          deadEnemies.add(j);
          state.score += 10;
          boom(e.x, e.y);
          break;
        }
      }
    }

    // Enemy-player collision / out of bounds
    for (let j = 0; j < state.enemies.length; j++) {
      if (deadEnemies.has(j)) continue;
      const e = state.enemies[j];

      if (hitEnemyPlayer(e)) {
        deadEnemies.add(j);
        state.life -= 1;
        boom(e.x, e.y);
        if (state.life <= 0) {
          gameOver("GAME OVER");
          return;
        }
      } else if (e.y > H + 20) {
        // Enemy escaped: small penalty
        deadEnemies.add(j);
        state.life -= 1;
        if (state.life <= 0) {
          gameOver("GAME OVER");
          return;
        }
      }
    }

    // Remove dead bullets
    if (deadBullets.size) {
      state.bullets = state.bullets.filter((b, idx) => {
        if (!deadBullets.has(idx)) return true;
        b.node.remove();
        return false;
      });
    }

    // Remove dead enemies
    if (deadEnemies.size) {
      state.enemies = state.enemies.filter((e, idx) => {
        if (!deadEnemies.has(idx)) return true;
        e.node.remove();
        return false;
      });
    }

    // HUD/status
    hud.textContent = `SCORE ${state.score} / LIFE ${state.life}`;
    status.textContent = `SCORE=${state.score}  LIFE=${state.life}  BULLETS=${state.bullets.length}  ENEMIES=${state.enemies.length}`;
  }

  function render() {
    // Player
    gPlayer.setAttribute("transform", `translate(${state.playerX}, ${PLAYER_Y})`);

    // Bullets
    for (const b of state.bullets) {
      b.node.setAttribute("cx", String(b.x));
      b.node.setAttribute("cy", String(b.y));
    }

    // Enemies
    for (const e of state.enemies) {
      e.node.setAttribute("transform", `translate(${e.x}, ${e.y})`);
    }
  }

  function gameOver(msg) {
    running = false;
    overlayText.textContent = msg;
    overlay.setAttribute("visibility", "visible");
    status.textContent = `GAME OVER: SCORE=${state.score}`;
  }

  function restart() {
    // Clear DOM groups
    for (const b of state.bullets) b.node.remove();
    for (const e of state.enemies) e.node.remove();
    state.bullets = [];
    state.enemies = [];

    state.score = 0;
    state.life = 3;
    state.playerX = W / 2;
    state.fireTimer = 0;
    state.spawnAccumulator = 0;

    overlay.setAttribute("visibility", "hidden");

    // Resume loop if stopped
    if (!running) {
      running = true;
      last = performance.now();
      requestAnimationFrame(loop);
    } else {
      hud.textContent = `SCORE 0 / LIFE 3`;
      status.textContent = `SCORE=0  LIFE=3`;
    }
  }

  // ---------- Utilities ----------
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function rand(lo, hi) { return lo + Math.random() * (hi - lo); }

  // Start
  hud.textContent = `SCORE 0 / LIFE 3`;
  status.textContent = `SCORE=0  LIFE=3`;
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
