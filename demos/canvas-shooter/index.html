<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Canvas Shooter - Balanced Boss</title>
<style>
  body { margin:0; background:black; overflow:hidden; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

resize();
window.addEventListener("resize", resize);
function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}

// =====================
// AUDIO（簡易）
// =====================
let audioCtx;
function initAudio(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  }
}
function play(freq, time=0.1){
  if(!audioCtx) return;
  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  o.frequency.value=freq;
  g.gain.value=0.15;
  o.connect(g).connect(audioCtx.destination);
  o.start();
  o.stop(audioCtx.currentTime+time);
}

// =====================
// GAME STATE
// =====================
let player={x:canvas.width/2,y:canvas.height-40};
let bullets=[], enemies=[], enemyBullets=[];
let score=0, shake=0;
let invincible=0;

// =====================
// INPUT
// =====================
document.addEventListener("mousemove",e=>{
  initAudio();
  player.x=e.clientX;
});
document.addEventListener("keydown",e=>{
  initAudio();
  if(e.key===" ") shoot();
  if(e.key==="r") location.reload();
});

// =====================
// LOGIC
// =====================
function shoot(){
  play(900,0.05);
  bullets.push({x:player.x,y:player.y,v:-14});
}

function spawnEnemy(type="normal"){
  enemies.push({
    type,
    x:Math.random()*canvas.width,
    y:-30,
    v:type==="boss"?0.6:2+Math.random()*2,
    r:type==="boss"?26:14,
    hp:type==="boss"?18:1,
    cool:0,
    phase:1
  });
}
setInterval(()=>spawnEnemy(),500);

// ---- boss bullets ----
let spiral=0;
function fireBoss(e){
  const n=e.phase===1?10:14;
  const speed=e.phase===1?2.0:2.6;
  for(let i=0;i<n;i++){
    const a=(Math.PI*2/n)*i+spiral;
    enemyBullets.push({
      x:e.x,y:e.y,
      vx:Math.cos(a)*speed,
      vy:Math.sin(a)*speed,
      r:4
    });
  }
  spiral+=e.phase===1?0.08:0.15;
  e.cool=45; // 休憩
}

function update(){
  if(invincible>0) invincible--;

  bullets.forEach(b=>b.y+=b.v);
  enemyBullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;});
  enemies.forEach(e=>e.y+=e.v);

  bullets=bullets.filter(b=>b.y>-50);
  enemyBullets=enemyBullets.filter(b=>
    b.x>-50&&b.x<canvas.width+50&&b.y>-50&&b.y<canvas.height+50
  );
  enemies=enemies.filter(e=>e.y<canvas.height+80);

  enemies.forEach(e=>{
    if(e.type==="boss"){
      if(e.hp<9) e.phase=2;
      e.cool--;
      if(e.cool<=0){
        fireBoss(e);
      }
    }
  });

  enemies.forEach((e,ei)=>{
    bullets.forEach((b,bi)=>{
      const dx=e.x-b.x, dy=e.y-b.y;
      if(dx*dx+dy*dy<e.r*e.r){
        bullets.splice(bi,1);
        e.hp--;
        play(200,0.08);
        if(e.hp<=0){
          enemies.splice(ei,1);
          shake=20;
          score+=e.type==="boss"?10:1;
        }
      }
    });
  });

  enemyBullets.forEach(b=>{
    const dx=b.x-player.x, dy=b.y-player.y;
    if(invincible===0 && dx*dx+dy*dy<100){
      invincible=60; // 無敵
    }
  });

  if(score===25){
    spawnEnemy("boss");
  }
}

// =====================
// DRAW
// =====================
function clear(){
  ctx.fillStyle="rgba(0,0,0,0.3)";
  ctx.fillRect(0,0,canvas.width,canvas.height);
}

function draw(){
  ctx.save();
  if(shake){
    ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
    shake--;
  }
  clear();

  bullets.forEach(b=>{
    ctx.fillStyle="orange";
    ctx.beginPath();
    ctx.arc(b.x,b.y,5,0,Math.PI*2);
    ctx.fill();
  });

  enemyBullets.forEach(b=>{
    ctx.fillStyle="magenta";
    ctx.beginPath();
    ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.fill();
  });

  enemies.forEach(e=>{
    ctx.fillStyle=e.type==="boss"?"lime":"red";
    ctx.beginPath();
    ctx.arc(e.x,e.y,e.r*2,0,Math.PI*2);
    ctx.fill();
  });

  if(invincible%10<5){
    ctx.fillStyle="#00ffff";
    ctx.beginPath();
    ctx.arc(player.x,player.y,12,0,Math.PI*2);
    ctx.fill();
  }

  ctx.restore();
  ctx.fillStyle="white";
  ctx.font="16px monospace";
  ctx.fillText("SCORE: "+score,20,30);
}

// =====================
// LOOP
// =====================
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
